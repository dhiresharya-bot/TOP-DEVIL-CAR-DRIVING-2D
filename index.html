<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CAR DRIVING 2D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#050510;font-family:Arial,Helvetica,sans-serif}
body{touch-action:none}
#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#050510}
#hud{position:fixed;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:5}
.hudBox{min-width:125px;padding:10px 14px;border:1px solid rgba(0,255,255,.55);border-radius:12px;background:rgba(0,0,20,.65);box-shadow:0 0 15px rgba(0,255,255,.18);color:white;font-size:13px}
.hudBig{font-size:21px;font-weight:bold;color:#00ffff}
#boostBar{width:120px;height:8px;margin-top:5px;border-radius:10px;background:#222;overflow:hidden}
#boostFill{width:100%;height:100%;background:linear-gradient(90deg,#00ffff,#ff00ff)}
#startScreen,#gameOver{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(circle at center,rgba(0,255,255,.12),transparent 35%),rgba(2,2,15,.86);color:white}
#gameOver{display:none}
.logo{font-size:clamp(42px,9vw,100px);font-weight:900;letter-spacing:8px;color:#00ffff;text-shadow:0 0 8px #00ffff,0 0 25px #00ffff,0 0 50px #0088ff}
.subtitle{margin-top:10px;color:#ddd;font-size:clamp(14px,2vw,22px);letter-spacing:3px}
button{margin-top:30px;padding:15px 35px;border:2px solid #00ffff;border-radius:12px;background:#06131b;color:#00ffff;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 0 12px #00ffff,inset 0 0 15px rgba(0,255,255,.12)}
button:hover{background:#00ffff;color:#001014}
.tip{margin-top:18px;color:#aaa;font-size:13px;line-height:1.7}
#touchControls{position:fixed;inset:0;z-index:10;pointer-events:none}
.touchBtn{position:absolute;width:70px;height:70px;border-radius:50%;border:2px solid rgba(0,255,255,.65);background:rgba(0,30,40,.45);color:white;display:flex;align-items:center;justify-content:center;font-size:25px;pointer-events:auto;backdrop-filter:blur(4px)}
#leftBtn{left:25px;bottom:30px}#rightBtn{left:105px;bottom:30px}#gasBtn{right:25px;bottom:105px}#brakeBtn{right:105px;bottom:30px}#boostBtn{right:25px;bottom:30px;color:#ff4dff;border-color:#ff4dff}
#joystick{
position:absolute;left:24px;bottom:24px;width:132px;height:132px;border-radius:50%;
border:2px solid rgba(0,255,255,.55);background:rgba(0,30,40,.45);
backdrop-filter:blur(4px);pointer-events:auto;touch-action:none;
box-shadow:inset 0 0 25px rgba(0,255,255,.12);
}
#stick{
position:absolute;left:41px;top:41px;width:46px;height:46px;border-radius:50%;
display:flex;align-items:center;justify-content:center;
background:rgba(0,234,255,.72);color:#001014;font-size:14px;font-weight:bold;
box-shadow:0 0 18px rgba(0,234,255,.7);pointer-events:none;
}
@media (min-width:800px){#touchControls{display:none}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:8;background:white;opacity:0}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
<div class="hudBox">SCORE<div class="hudBig" id="score">0</div></div>
<div class="hudBox">COINS<div class="hudBig" id="coins">0</div></div>
<div class="hudBox">SPEED<div class="hudBig"><span id="speed">0</span> KM/H</div><div id="boostBar"><div id="boostFill"></div></div></div>
<div class="hudBox">FPS<div class="hudBig" id="fps">0</div></div>
</div>
<div id="startScreen">
<div class="logo">CAR DRIVING 2D</div><div class="subtitle">2D CITY DRIVE</div>
<button id="startBtn">START DRIVE 🚗</button>
<div class="tip">WASD / ARROW KEYS = DRIVE<br>SPACE = BOOST<br>HOLD LEFT MOUSE = STEER<br>MOBILE: JOYSTICK + BUTTONS</div>
</div>
<div id="gameOver">
<div class="logo" style="font-size:clamp(35px,7vw,80px)">CRASHED</div>
<div class="subtitle">FINAL SCORE: <span id="finalScore">0</span></div>
<button id="restartBtn">DRIVE AGAIN 🚗</button>
</div>
<div id="flash"></div>
<div id="touchControls">
<div id="joystick"><div id="stick">●</div></div>
<div class="touchBtn" id="gasBtn">▲</div><div class="touchBtn" id="brakeBtn">▼</div><div class="touchBtn" id="boostBtn">⚡</div>
</div>
<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();
const startScreen=document.getElementById("startScreen"),gameOver=document.getElementById("gameOver"),scoreEl=document.getElementById("score"),coinsEl=document.getElementById("coins"),speedEl=document.getElementById("speed"),boostFill=document.getElementById("boostFill"),finalScore=document.getElementById("finalScore"),flash=document.getElementById("flash");
let audioCtx=null;
function audioStart(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}
function beep(freq,duration,type="sine",volume=.04){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=volume;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.stop(audioCtx.currentTime+duration)}
const kb={w:false,a:false,s:false,d:false,up:false,down:false,left:false,right:false,boost:false};
addEventListener("keydown",e=>{
  if(e.repeat) return;
  switch(e.code){
    case "KeyW": kb.w=true; break; case "KeyA": kb.a=true; break; case "KeyS": kb.s=true; break; case "KeyD": kb.d=true; break;
    case "ArrowUp": kb.up=true; break; case "ArrowDown": kb.down=true; break; case "ArrowLeft": kb.left=true; break; case "ArrowRight": kb.right=true; break; case "Space": kb.boost=true; break;
    default: return;
  } e.preventDefault(); audioStart();
});
addEventListener("keyup",e=>{
  switch(e.code){
    case "KeyW": kb.w=false; break; case "KeyA": kb.a=false; break; case "KeyS": kb.s=false; break; case "KeyD": kb.d=false; break;
    case "ArrowUp": kb.up=false; break; case "ArrowDown": kb.down=false; break; case "ArrowLeft": kb.left=false; break; case "ArrowRight": kb.right=false; break; case "Space": kb.boost=false; break;
  } e.preventDefault();
});
function resetAllControls(){for(const k in kb)kb[k]=false;touch.left=false;touch.right=false;touch.gas=false;touch.brake=false;touch.boost=false;if(typeof resetJoystick==="function")resetJoystick()}
addEventListener("blur",resetAllControls);addEventListener("pagehide",resetAllControls);addEventListener("visibilitychange",()=>{if(document.hidden)resetAllControls()});
let mouseX=W/2,mouseActive=false,mouseSteerHeld=false;
addEventListener("mousemove",e=>{mouseX=e.clientX;mouseActive=mouseSteerHeld});
addEventListener("mousedown",e=>{if(e.button===0){mouseSteerHeld=true;mouseActive=true;mouseX=e.clientX}});
addEventListener("mouseup",e=>{if(e.button===0){mouseSteerHeld=false;mouseActive=false}});
addEventListener("mouseleave",()=>{mouseActive=false;mouseSteerHeld=false});
addEventListener("blur",()=>{mouseActive=false;mouseSteerHeld=false});
const touch={left:false,right:false,gas:false,brake:false,boost:false};
function touchButton(id,name){const el=document.getElementById(id),down=e=>{e.preventDefault();touch[name]=true;audioStart()},up=e=>{e.preventDefault();touch[name]=false};el.addEventListener("pointerdown",down);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);el.addEventListener("pointerleave",up)}
touchButton("gasBtn","gas");touchButton("brakeBtn","brake");touchButton("boostBtn","boost");
addEventListener("pointerup",()=>{touch.left=false;touch.right=false;touch.gas=false;touch.brake=false;touch.boost=false});
const joystick=document.getElementById("joystick"),stick=document.getElementById("stick");let joyPointer=null;
function moveJoystick(e){const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.30,dist=Math.hypot(dx,dy);if(dist>max){dx=dx/dist*max;dy=dy/dist*max}stick.style.transform=`translate(${dx}px,${dy}px)`;touch.left=dx<-18;touch.right=dx>18}
joystick.addEventListener("pointerdown",e=>{e.preventDefault();joyPointer=e.pointerId;joystick.setPointerCapture(e.pointerId);audioStart();moveJoystick(e)});
joystick.addEventListener("pointermove",e=>{if(e.pointerId===joyPointer){e.preventDefault();moveJoystick(e)}});
function resetJoystick(){joyPointer=null;stick.style.transform="translate(0,0)";touch.left=false;touch.right=false}
joystick.addEventListener("pointerup",resetJoystick);joystick.addEventListener("pointercancel",resetJoystick);
let running=false,last=0,score=0,coins=0,distance=0,speed=0,maxSpeed=8,boost=100,roadOffset=0,worldTime=0,shake=0,best=Number(localStorage.getItem("neonBest")||0);
let fps=0,fpsFrames=0,fpsTimer=0;
const player={x:0,y:0,w:42,h:76,angle:0,color:"#00eaff"};
let traffic=[],collectibles=[],particles=[],stars=[],buildings=[];
function createStars(){stars=[];for(let i=0;i<180;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.48,r:Math.random()*1.8+.2,a:Math.random()})}
function createBuildings(){buildings=[];const sideWidth=Math.max(90,W*.18);for(let side of[-1,1])for(let i=0;i<35;i++)buildings.push({side,x:side<0?Math.random()*sideWidth:W-sideWidth+Math.random()*sideWidth,y:Math.random()*H,w:35+Math.random()*80,h:70+Math.random()*180,speed:.4+Math.random()*.8,hue:Math.random()*360,windows:Math.floor(3+Math.random()*7)})}
function spawnTraffic(index=0){const lanes=[-.33,-.11,.11,.33],lane=lanes[Math.floor(Math.random()*lanes.length)];traffic.push({x:W/2+lane*W*.72,y:-150-index*180-Math.random()*200,w:38+Math.random()*8,h:68+Math.random()*18,speed:2+Math.random()*3,color:["#ff304f","#ff8c00","#a855f7","#32ff7e","#ffd43b","#3b82f6"][Math.floor(Math.random()*6)],lane})}
function spawnCoin(index=0){const lanes=[-.33,-.11,.11,.33],lane=lanes[Math.floor(Math.random()*lanes.length)];collectibles.push({x:W/2+lane*W*.72,y:-100-index*160-Math.random()*250,r:11,spin:Math.random()*Math.PI*2})}
function particle(x,y,color="#00ffff",amount=10){for(let i=0;i<amount;i++)particles.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:1,size:2+Math.random()*5,color})}
function collide(a,b){return a.x-a.w*.42<b.x+b.w*.42&&a.x+a.w*.42>b.x-b.w*.42&&a.y-a.h*.42<b.y+b.h*.42&&a.y+a.h*.42>b.y-b.h*.42}
function roadBounds(){return{left:W*.22,right:W*.78}}
function resetGame(){score=0;coins=0;distance=0;speed=0;boost=100;roadOffset=0;traffic=[];collectibles=[];particles=[];player.x=W/2;player.y=H*.75;shake=0;createStars();createBuildings();for(let i=0;i<7;i++)spawnTraffic(i);for(let i=0;i<10;i++)spawnCoin(i);updateUI()}
function update(dt){
worldTime+=dt;const road=roadBounds();
const gas=kb.w||kb.up||touch.gas,brake=kb.s||kb.down||touch.brake,left=kb.a||kb.left||touch.left,right=kb.d||kb.right||touch.right,boosting=kb.boost||touch.boost;
if(gas)speed+=.16;else speed-=.055;if(brake)speed-=.2;speed=Math.max(0,Math.min(maxSpeed,speed));
if(boosting&&boost>0&&speed>1){speed+=.18;boost-=.55;if(boost<0)boost=0}else{boost+=.16;if(boost>100)boost=100}
let steer=0;if(left)steer-=1;if(right)steer+=1;
if(mouseActive&&mouseSteerHeld&&W>800){let difference=mouseX-W/2;if(Math.abs(difference)>30){steer=difference/(W*.35);steer=Math.max(-1,Math.min(1,steer))}}
player.x+=steer*(6.2+speed*.45);player.angle=steer*.16;
if(player.x<road.left+25)player.x=road.left+25;if(player.x>road.right-25)player.x=road.right-25;
roadOffset+=speed*dt*90;distance+=speed*dt*.08;score+=speed*dt*.35;
for(const car of traffic){car.y+=(car.speed+speed*.75)*dt*60;car.x+=Math.sin(worldTime*1.3+car.y*.01)*.15;if(car.y>H+150){car.y=-200-Math.random()*250;const lanes=[-.33,-.11,.11,.33];car.lane=lanes[Math.floor(Math.random()*lanes.length)];car.x=W/2+car.lane*W*.72;car.speed=2+Math.random()*3;car.color=["#ff304f","#ff8c00","#a855f7","#32ff7e","#ffd43b","#3b82f6"][Math.floor(Math.random()*6)]}if(collide(player,car)){crash();return}}
for(const c of collectibles){c.y+=(speed*.9+2)*dt*60;c.spin+=dt*6;const dx=player.x-c.x,dy=player.y-c.y;if(Math.hypot(dx,dy)<35){coins++;score+=100;particle(c.x,c.y,"#ffd700",20);beep(900,.08,"square",.07);beep(1300,.12,"sine",.04);c.y=-200-Math.random()*300}if(c.y>H+100){c.y=-100-Math.random()*400;const lanes=[-.33,-.11,.11,.33],lane=lanes[Math.floor(Math.random()*lanes.length)];c.x=W/2+lane*W*.72}}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life-=dt*2;if(p.life<=0)particles.splice(i,1)}
shake*=.9;updateUI()
}
function crash(){running=false;particle(player.x,player.y,"#ff304f",70);shake=25;flash.style.opacity=.8;setTimeout(()=>flash.style.opacity=0,80);beep(100,.25,"sawtooth",.08);beep(60,.4,"square",.05);const rounded=Math.floor(score);if(rounded>best){best=rounded;localStorage.setItem("neonBest",best)}finalScore.textContent=rounded;setTimeout(()=>gameOver.style.display="flex",500)}
function updateUI(){scoreEl.textContent=Math.floor(score);coinsEl.textContent=coins;speedEl.textContent=Math.floor(speed*22);boostFill.style.width=boost+"%"}
function drawBackground(){
const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,"#050018");sky.addColorStop(.45,"#09052c");sky.addColorStop(1,"#02040a");ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
ctx.save();ctx.shadowBlur=30;ctx.shadowColor="#b8f3ff";ctx.fillStyle="#d9ffff";ctx.beginPath();ctx.arc(W*.78,H*.16,35,0,Math.PI*2);ctx.fill();ctx.restore();
for(const s of stars){ctx.globalAlpha=.5+.5*Math.sin(worldTime*2+s.a*10);ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
for(const b of buildings){let y=b.y+roadOffset*b.speed;y%=H+250;if(y>H+150)y-=H+250;if(y<-250)y+=H+250;const x=b.x;ctx.fillStyle="#080b18";ctx.fillRect(x,y,b.w,b.h);ctx.strokeStyle="rgba(0,255,255,.15)";ctx.strokeRect(x,y,b.w,b.h);for(let row=0;row<b.windows;row++){const wy=y+15+row*22;if(wy>H||wy<0)continue;for(let col=0;col<3;col++){const wx=x+8+col*(b.w/3);if(wx>x+b.w-8)continue;if(Math.sin(row*7+col*3+b.h)>0){ctx.fillStyle=Math.random()>.5?"rgba(0,255,255,.7)":"rgba(255,0,255,.65)";ctx.fillRect(wx,wy,5,9)}}}}
const road=roadBounds();ctx.fillStyle="#0b0b12";ctx.fillRect(road.left,0,road.right-road.left,H);ctx.save();ctx.shadowBlur=15;ctx.shadowColor="#00ffff";ctx.fillStyle="#00eaff";ctx.fillRect(road.left,0,3,H);ctx.fillRect(road.right-3,0,3,H);ctx.restore();
const laneX=[W/2-W*.18,W/2,W/2+W*.18];ctx.strokeStyle="rgba(255,255,255,.3)";ctx.lineWidth=3;ctx.setLineDash([40,45]);for(const x of laneX){ctx.lineDashOffset=roadOffset;ctx.beginPath();ctx.moveTo(x,-100);ctx.lineTo(x,H+100);ctx.stroke()}ctx.setLineDash([]);
for(let y=-100;y<H+100;y+=75){const yy=(y+roadOffset*.8)%(H+150)-50;ctx.fillStyle="#ff00ff";ctx.shadowBlur=15;ctx.shadowColor="#ff00ff";ctx.fillRect(road.left-18,yy,5,25);ctx.fillStyle="#00ffff";ctx.shadowColor="#00ffff";ctx.fillRect(road.right+13,yy+25,5,25)}ctx.shadowBlur=0
}
function drawCar(x,y,w,h,color,angle=0,isPlayer=false){
ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.shadowBlur=isPlayer?22:10;ctx.shadowColor=color;ctx.fillStyle="rgba(0,0,0,.6)";ctx.beginPath();ctx.ellipse(0,h*.38,w*.65,h*.22,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#050509";const wheelW=9,wheelH=20;
ctx.fillRect(-w/2-wheelW/2+4,-h*.25,wheelW,wheelH);ctx.fillRect(w/2-wheelW/2-4,-h*.25,wheelW,wheelH);ctx.fillRect(-w/2-wheelW/2+4,h*.15,wheelW,wheelH);ctx.fillRect(w/2-wheelW/2-4,h*.15,wheelW,wheelH);
ctx.shadowBlur=isPlayer?18:8;ctx.shadowColor=color;ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,9);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#06121e";ctx.beginPath();ctx.roundRect(-w*.33,-h*.27,w*.66,h*.43,7);ctx.fill();
ctx.fillStyle="rgba(80,230,255,.55)";ctx.beginPath();ctx.moveTo(-w*.27,-h*.22);ctx.lineTo(w*.27,-h*.22);ctx.lineTo(w*.22,-h*.02);ctx.lineTo(-w*.22,-h*.02);ctx.closePath();ctx.fill();
ctx.fillStyle="#fff";ctx.shadowBlur=12;ctx.shadowColor="#fff";ctx.fillRect(-w*.32,-h*.48,w*.2,6);ctx.fillRect(w*.12,-h*.48,w*.2,6);
ctx.fillStyle="#ff1744";ctx.fillRect(-w*.32,h*.42,w*.2,5);ctx.fillRect(w*.12,h*.42,w*.2,5);
if(isPlayer){ctx.fillStyle="#fff";ctx.fillRect(-w*.05,-h*.43,w*.1,h*.8)}ctx.restore()
}
function drawCoin(c){ctx.save();ctx.translate(c.x,c.y);ctx.scale(.65+.35*Math.abs(Math.sin(c.spin)),1);ctx.shadowBlur=20;ctx.shadowColor="#ffd700";ctx.fillStyle="#ffd700";ctx.beginPath();ctx.arc(0,0,c.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#fff5a3";ctx.beginPath();ctx.arc(0,0,c.r*.55,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.shadowBlur=10;ctx.shadowColor=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0}
function draw(){
ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawBackground();for(const c of collectibles)drawCoin(c);for(const car of traffic)drawCar(car.x,car.y,car.w,car.h,car.color,0,false);drawCar(player.x,player.y,player.w,player.h,player.color,player.angle,true);
const boosting=kb.boost||touch.boost;if(boosting&&boost>0&&speed>1){ctx.save();ctx.translate(player.x,player.y+player.h*.55);ctx.globalAlpha=.8;ctx.shadowBlur=20;ctx.shadowColor="#ff00ff";ctx.fillStyle="#ff00ff";ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(0,35+Math.random()*20);ctx.lineTo(9,0);ctx.fill();ctx.restore()}drawParticles();ctx.restore()
}
function loop(t){
if(!last)last=t;let dt=(t-last)/1000;last=t;dt=Math.min(dt,.033);
fpsFrames++;fpsTimer+=dt;if(fpsTimer>=0.5){fps=Math.round(fpsFrames/fpsTimer);document.getElementById("fps").textContent=fps;fpsFrames=0;fpsTimer=0}
if(running)update(dt);draw();requestAnimationFrame(loop)
}
function startGame(){audioStart();resetGame();running=true;startScreen.style.display="none";gameOver.style.display="none";beep(500,.1,"square",.04);beep(800,.15,"sine",.04)}
document.getElementById("startBtn").addEventListener("click",startGame);document.getElementById("restartBtn").addEventListener("click",startGame);
createStars();createBuildings();player.x=W/2;player.y=H*.75;requestAnimationFrame(loop);
</script>
</body>
</html>
